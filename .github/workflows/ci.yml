name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      # Fails when this package's version escapes the published
      # darwin-langgraph peer range — publishing such a version breaks every
      # fresh paired install (happened twice: 0.9.0, 0.11.0). Network-tolerant:
      # registry hiccups warn + pass instead of flaking the build.
      - name: Adapter peer-compat guard (darwin-langgraph)
        run: npm run check:adapter-compat
